name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # pure-Python fallback used when numba is not installed
          - variant: pure-python
            sync-args: ""
            expect-numba: "False"
          # compiled kernels from the optional with-numba extra
          - variant: numba
            sync-args: "--extra with-numba"
            expect-numba: "True"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: uv sync --locked ${{ matrix.sync-args }}

      - name: Check numba availability matches the variant
        run: |
          uv run --locked ${{ matrix.sync-args }} python -c "
          from pyrunoff.utils.compat import HAS_NUMBA
          assert str(HAS_NUMBA) == '${{ matrix.expect-numba }}', HAS_NUMBA
          print('HAS_NUMBA =', HAS_NUMBA)
          "

      - name: Run unit tests
        run: uv run --locked ${{ matrix.sync-args }} pytest
